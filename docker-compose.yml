services:
  # PostgreSQL Database (simplified from TimescaleDB)
  postgres:
    image: postgres:15
    container_name: palletvision_db
    environment:
      POSTGRES_USER: pallet
      POSTGRES_PASSWORD: pallet
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pallet -h localhost -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Combined Backend + Frontend + AI Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palletvision_app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql+psycopg2://pallet:pallet@postgres:5432/warehouse
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-this}
      - WEIGHTS_PATH=/app/model/best.pt
      - IMAGES_DIR=/app/images/
      - OUTPUT_DIR=/app/static/images/
    ports:
      - "3000:3000"  # Frontend
      - "5000:5000"  # Backend API
    volumes:
      - ./backend/app/ai_service/model:/app/model:ro
      - ./backend/app/ai_service/images:/app/images:ro
      - ./frontend/public:/app/static
      - inference_results:/app/static/images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  inference_results: